<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phorva Developer — Set new password</title>
  <link rel="icon" href="/phorva-logo.png">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #05070d;
      --panel: #090d17;
      --border: #182238;
      --text: #f5f7ff;
      --muted: #7f8aa3;
      --muted-2: #5f6b82;
      --accent: #7c8cff;
      --danger-bg: #160b10;
      --danger-border: #4b2530;
      --danger-text: #d99aa8;
      --success-bg: #091710;
      --success-border: #214b38;
      --success-text: #9bd4b5;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui,
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .shell {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      margin-bottom: 34px;
    }

    .brand img {
      width: 34px;
      height: 34px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .eyebrow {
      text-align: center;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 9px 0 7px;
      text-align: center;
      font-size: 29px;
      line-height: 1.1;
    }

    .subtitle {
      margin-bottom: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:
        linear-gradient(
          145deg,
          rgba(13,19,32,.96),
          rgba(7,11,19,.96)
        );
    }

    .field { margin-bottom: 17px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #c5ccdd;
      font-size: 12px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #070b13;
      color: #fff;
    }

    input:focus {
      border-color: #354675;
      box-shadow: 0 0 0 3px rgba(124,140,255,.08);
    }

    .submit {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #2a3760;
      border-radius: 9px;
      background: #11182a;
      color: #fff;
      font-weight: 650;
    }

    .submit:disabled {
      cursor: wait;
      opacity: .55;
    }

    .notice {
      display: none;
      margin-bottom: 17px;
      padding: 12px 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.45;
    }

    .notice.visible { display: block; }

    .notice.error {
      border: 1px solid var(--danger-border);
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .notice.success {
      border: 1px solid var(--success-border);
      background: var(--success-bg);
      color: var(--success-text);
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer a { color: #b7c0ff; }
  </style>
</head>

<body>
  <main class="shell">

    <a class="brand" href="/">
      <img src="/phorva-logo.png" alt="Phorva">
      <span class="brand-name">PHORVA</span>
    </a>

    <div class="eyebrow">Developer Console</div>

    <h1>Set a new password</h1>

    <div class="subtitle">
      Choose a new password for your Phorva developer account.
    </div>

    <section class="panel">

      <div id="notice" class="notice"></div>

      <form id="resetForm">

        <div class="field">
          <label for="password">
            New password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="new-password"
            placeholder="New password"
            minlength="12"
            maxlength="128"
            required
          >
        </div>

        <div class="field">
          <label for="confirmPassword">
            Confirm new password
          </label>

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Repeat new password"
            minlength="12"
            maxlength="128"
            required
          >
        </div>

        <button
          id="submit"
          class="submit"
          type="submit"
        >
          Update password
        </button>

      </form>

    </section>

    <div class="footer">
      <a href="/developer/login.html">
        ← Back to sign in
      </a>
    </div>

  </main>

  <script>
    const form =
      document.getElementById("resetForm");

    const submit =
      document.getElementById("submit");

    const notice =
      document.getElementById("notice");

    const params =
      new URLSearchParams(
        window.location.search
      );

    const token =
      params.get("token") || "";

    function showNotice(
      message,
      type
    ) {
      notice.textContent = message;
      notice.className =
        `notice visible ${type}`;
    }

    if (!token) {
      submit.disabled = true;

      showNotice(
        "This password reset link is missing its reset token.",
        "error"
      );
    }

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;

        if (password !== confirmPassword) {
          showNotice(
            "Passwords do not match.",
            "error"
          );
          return;
        }

        submit.disabled = true;
        submit.textContent =
          "Updating password...";

        try {
          const response =
            await fetch(
              "/v1/developer/reset-password",
              {
                method: "POST",
                credentials: "same-origin",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                  token,
                  password
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data?.error?.message ||
              "Unable to reset password."
            );
          }

          showNotice(
            "Password reset successfully. Redirecting to sign in...",
            "success"
          );

          window.setTimeout(() => {
            window.location.replace(
              "/developer/login.html"
            );
          }, 1200);

        } catch (error) {
          showNotice(
            error.message ||
            "Unable to reset password.",
            "error"
          );

          submit.disabled = false;
          submit.textContent =
            "Update password";
        }
      }
    );
  </script>
</body>
</html>
