<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phorva Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/docs/styles.css">

<style id="phorva-single-page-docs">
  .docs-sidebar,
  #docs-menu,
  #docs-close {
    display: none !important;
  }
  .docs-layout,
  .docs-shell,
  .docs-main {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  #docs-content {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
  }
  .docs-section {
    display: flow-root;
    padding: 0 0 2.5rem;
    margin: 0 0 2.5rem;
    border-bottom: 1px solid var(--border, #303744);
    scroll-margin-top: 24px;
  }
  .docs-section:last-child {
    border-bottom: 0;
  }
</style>

</head>
<body>
<div class="docs-shell">

  <aside class="docs-sidebar" id="docs-sidebar">
    <div class="docs-brand">
      <img src="/phorva-logo.png" alt="Phorva">
      <div>
        <div class="docs-brand-name">PHORVA</div>
        <div class="docs-brand-sub">VERIFIABLE EXECUTION</div>
      </div>
    </div>

    <div class="nav-wrap" id="docs-nav"></div>
  </aside>

  <main class="docs-main">

    <header class="docs-topbar">
      <button class="icon-button menu-button" id="docs-menu">☰</button>

      <div class="search">
        <input
          id="docs-search"
          type="search"
          placeholder="Search documentation  ·  Ctrl K"
          autocomplete="off"
        >
      </div>

      <div class="top-actions">
        <a class="docs-link" href="/">Phorva</a>
        <a class="docs-link" href="/docs">Docs</a>
        <a class="docs-link" href="/docs/quickstart">Get Started</a>
        <button class="icon-button" id="docs-theme">Theme</button>
        <button class="icon-button" id="docs-close">Close</button>
      </div>
    </header>

    <article class="docs-content" id="docs-content"></article>

  </main>
</div>

<script src="/docs/app.js"></script>
</body>
</html>

<style id="phorva-docs-readable-type">
  #docs-content {
    font-size: 18px !important;
    line-height: 1.8 !important;
  }

  #docs-content p,
  #docs-content li,
  #docs-content td,
  #docs-content th,
  #docs-content blockquote {
    font-size: 18px !important;
    line-height: 1.8 !important;
  }

  #docs-content h1 {
    font-size: clamp(34px, 4vw, 44px) !important;
    line-height: 1.2 !important;
    margin-bottom: 24px !important;
  }

  #docs-content h2 {
    font-size: clamp(27px, 3vw, 34px) !important;
    line-height: 1.3 !important;
    margin-top: 36px !important;
  }

  #docs-content h3 {
    font-size: 23px !important;
    line-height: 1.4 !important;
    margin-top: 28px !important;
  }

  #docs-content pre,
  #docs-content code {
    font-size: 15px !important;
    line-height: 1.7 !important;
  }

  #docs-content .docs-section {
    padding-bottom: 40px;
    margin-bottom: 40px;
  }
</style>
